services:
  - type: web
    name: biga-cheat-site
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        # ZORUNLU: Kalıcı veri için Neon (veya başka) Postgres adresini
        # Render Dashboard > Environment değişkenine gir (sync: false = panelden set edilir).
        # Girilmezse /data diskine SQLite yazılır (render.yaml altındaki disk tanımına bak).
        sync: false
      - key: COOKIE_SECURE
        value: "1"
    healthCheckPath: /health
    disk:
      name: biga-cheat-data
      mountPath: /data
      sizeGB: 1
